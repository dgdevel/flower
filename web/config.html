<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flower — configuration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">flower</a>
    <nav>
      <a href="config.html">Config</a>
      <a href="components.html">Components</a>
    </nav>
  </header>
  <main class="page">
    <h1>Configuration</h1>
    <p class="muted">
      The theme is stored as <code>theme.json</code> in the app config
      directory and applied to every page. Changes preview instantly;
      <em>Save</em> validates and persists them.
      <a href="components.html">Open the component gallery →</a>
    </p>

    <form id="theme-form" autocomplete="off"></form>

    <div class="save-bar">
      <span id="cfg-status" class="muted"></span>
      <span class="save-actions">
        <button type="button" id="reset" class="btn">Reset to defaults</button>
        <button type="button" id="save" class="btn btn-accent">Save</button>
      </span>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="config.js"></script>
</body>
</html>
