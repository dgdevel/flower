<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flower</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app">
  <header class="top">
    <a class="brand" href="./">flower</a>
    <nav>
      <a href="config.html">Config</a>
      <a href="components.html">Components</a>
    </nav>
  </header>

  <main class="deck" id="deck">
    <section class="pane projects-pane" aria-label="Projects" data-pane="0">
      <div class="rail" id="rail" aria-label="Projects">
        <button type="button" class="chip chip-add" id="add-project"
                title="Add a project" aria-label="Add a project">+</button>
      </div>
      <div class="editor">
        <div class="pane-head">
          <h1>Projects</h1>
          <span class="pane-hint" id="project-count"></span>
        </div>
        <div class="pane-body" id="editor"><!-- filled by app.js --></div>
      </div>
    </section>

    <section class="pane conversations-pane" aria-label="Conversations" data-pane="1">
      <div class="pane-head">
        <h2>Conversations</h2>
        <span class="pane-hint" id="conv-count"></span>
      </div>
      <div class="pane-warn">
        <p class="warn-title">Project unavailable</p>
        <p class="warn-text"><!-- filled by app.js --></p>
      </div>
      <div class="conv-top">
        <div class="conv-topbar">
          <button type="button" class="btn btn-accent" id="new-conversation"
                  data-action="conv-new">New conversation</button>
        </div>
        <div class="conv-list" id="conv-list" aria-label="Conversations"></div>
      </div>
      <div class="conv-split" aria-hidden="true"></div>
      <div class="conv-details" id="conv-details" aria-label="Conversation details"></div>
    </section>

    <section class="pane" aria-label="Column three" data-pane="2">
      <div class="pane-head">
        <h2>Column three</h2>
        <span class="pane-hint">reserved</span>
      </div>
      <div class="pane-warn">
        <p class="warn-title">Project unavailable</p>
        <p class="warn-text"><!-- filled by app.js --></p>
      </div>
      <div class="placeholder-body">
        <p class="placeholder-title">Nothing here yet</p>
        <p class="placeholder-text">The conversation picked in column two
        opens here — the talk itself, once flower grows into it.</p>
      </div>
    </section>
  </main>

  <nav class="deck-dots" id="deck-dots" aria-label="Move between columns"></nav>

  <script src="theme.js"></script>
  <script src="emoji.js"></script>
  <script src="app.js"></script>
</body>
</html>
