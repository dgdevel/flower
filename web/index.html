<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flower</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app">
  <header class="top">
    <a class="brand" href="./">flower</a>
    <nav>
      <a href="config.html">Config</a>
      <a href="components.html">Components</a>
    </nav>
  </header>

  <main class="deck" id="deck">
    <section class="pane projects-pane" aria-label="Projects" data-pane="0">
      <div class="rail" id="rail" aria-label="Projects">
        <button type="button" class="chip chip-add" id="add-project"
                title="Add a project" aria-label="Add a project">+</button>
      </div>
      <div class="editor">
        <div class="pane-head">
          <h1>Projects</h1>
          <span class="pane-hint" id="project-count"></span>
        </div>
        <div class="pane-body" id="editor"><!-- filled by app.js --></div>
      </div>
    </section>

    <section class="pane tasks-pane" aria-label="Tasks" data-pane="1">
      <div class="pane-head">
        <h2>Tasks</h2>
        <span class="pane-hint" id="task-count"></span>
      </div>
      <div class="pane-warn">
        <p class="warn-title">Project unavailable</p>
        <p class="warn-text"><!-- filled by app.js --></p>
      </div>
      <div class="task-top">
        <div class="task-topbar">
          <button type="button" class="btn btn-accent" id="new-task"
                  data-action="task-new">New task</button>
        </div>
        <div class="task-list" id="task-list" aria-label="Tasks"></div>
      </div>
      <div class="task-split" aria-hidden="true"></div>
      <div class="task-details" id="task-details" aria-label="Task details"></div>
    </section>

    <section class="pane actions-pane" aria-label="Actions" data-pane="2">
      <div class="pane-head">
        <h2>Actions</h2>
        <span class="pane-hint" id="action-count"></span>
      </div>
      <div class="pane-warn">
        <p class="warn-title">Project unavailable</p>
        <p class="warn-text"><!-- filled by app.js --></p>
      </div>
      <div class="actions-top">
        <div class="task-topbar">
          <button type="button" class="btn btn-accent" id="new-action"
                  data-action="action-new">Add action</button>
        </div>
        <div class="action-list" id="action-list" aria-label="Actions"></div>
      </div>
      <div class="task-split" aria-hidden="true"></div>
      <div class="placeholder-body">
        <p class="placeholder-title">Nothing here yet</p>
        <p class="placeholder-text" id="col3-text">
          The lower half keeps its place in the layout. flower grows into
          it later.</p>
      </div>
    </section>
  </main>

  <nav class="deck-dots" id="deck-dots" aria-label="Move between columns"></nav>

  <script src="theme.js"></script>
  <script src="emoji.js"></script>
  <script src="app.js"></script>
</body>
</html>
